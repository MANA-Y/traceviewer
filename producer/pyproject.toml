[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traceviewer-producer"
version = "0.1.0"
description = "Code-first Python trace producer for Trace Viewer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["websockets>=12,<14"]
binary = ["pyinstaller>=6.10,<7"]

[project.scripts]
traceviewer = "traceviewer_producer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
