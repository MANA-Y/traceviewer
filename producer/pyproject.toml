[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traceviewer"
version = "0.2.0"
description = "Code-first slides for technical talks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["websockets>=12,<14"]
binary = ["pyinstaller>=6.10,<7"]

[project.scripts]
traceviewer = "traceviewer_producer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traceviewer = ["viewer/**"]

[tool.setuptools.cmdclass]
build_py = "traceviewer._build.build_py"
